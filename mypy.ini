[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy
exclude = (^tests/fixtures/|^build/|^dist/)
warn_unreachable = True
show_error_codes = True

[mypy-cyvcf2.*]
ignore_missing_imports = True

[mypy-pysam.*]
ignore_missing_imports = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
