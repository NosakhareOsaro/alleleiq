services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: alleleiq:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
