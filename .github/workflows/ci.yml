name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  UV_VERSION: "0.11"

jobs:
  lint:
    name: Lint (ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python pin 3.12
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check src tests
      - name: black --check
        run: uv run black --check src tests
      - name: mypy --strict
        run: uv run mypy --config-file=mypy.ini src

  test:
    name: Test (pytest, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python pin 3.12
      - run: uv sync --all-extras
      - name: pytest with coverage gate
        run: uv run pytest --cov-fail-under=85
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    name: Security (pip-audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python pin 3.12
      - run: uv sync --all-extras
      - name: pip-audit
        # --skip-editable: alleleiq itself is installed editable in this dev
        # environment and isn't a published PyPI package, so it can't be
        # looked up for vulnerabilities — this excludes it, not real deps.
        run: uv run pip-audit --skip-editable
      - name: bandit
        run: uv run bandit -r src -ll

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python pin 3.12
      - run: uv sync --all-extras
      - name: mkdocs build --strict
        run: uv run mkdocs build --strict
